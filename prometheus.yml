global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "autohealops"
    metrics_path: /metrics
    static_configs:
      - targets:
          - autohealops-app:5000

  - job_name: "cadvisor"
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: "recovery-controller"
    static_configs:
      - targets:
          - recovery-controller:8001
