
services:
  autohealops-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: autohealops:monitoring
    container_name: autohealops-app
    ports:
      - "5001:5000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 3

  recovery-controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    image: autohealops-controller
    container_name: autohealops-recovery-controller
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      TARGET_CONTAINER: autohealops-app
      CHECK_INTERVAL: "5"
      FAILURE_THRESHOLD: "2"
      RESTART_COOLDOWN: "60"
      RECOVERY_TIMEOUT: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      autohealops-app:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    container_name: autohealops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      autohealops-app:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    container_name: autohealops-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: autohealops-cadvisor
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

volumes:
  prometheus_data:
  grafana_data:
