# Merge this service into the team's main docker-compose.yml (Person 2),
# or run alongside it:  docker compose -f docker-compose.yml -f docker-compose.dashboard.yml up -d
#
# The monitoring engine (Person 3) must write its logs into the same ./logs folder.
services:
  dashboard:
    build: .
    container_name: autohealops-dashboard
    ports:
      - "8501:8501"
    environment:
      APP_URL: http://app:5000            # service name of the Flask app in the main compose file
      CONTAINER_NAME: autohealops-app     # container_name of the Flask app
      LOG_DIR: /app/logs
      DISPLAY_TZ: UTC                     # e.g. Asia/Kolkata
    volumes:
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock   # live container status (read-only use)
    restart: unless-stopped
