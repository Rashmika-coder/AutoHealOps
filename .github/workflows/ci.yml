name: AutoHealOps CI Pipeline

on:
  push:
    branches:
      - main
      - feature/docker-integration

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Install Dashboard Dependencies
        run: pip install -r autohealops_dashboard/requirements.txt

      - name: Run Unit Tests
        run: pytest -v

      - name: Build Docker Image
        run: docker build -t autohealops:v1 .
